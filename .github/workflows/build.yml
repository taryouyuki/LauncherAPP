name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Explicitly exclude the obsolete SDK package named 'tools'.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            'platforms;android-37' \
            'build-tools;36.0.0'
          yes | sdkmanager --licenses

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release APK (signed when secrets are configured)
        env:
          RELEASE_STORE_FILE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_STORE_FILE_B64" ]; then
            ./gradlew --no-daemon assembleRelease \
              -PRELEASE_STORE_FILE_B64="$RELEASE_STORE_FILE_B64" \
              -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
              -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
              -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
          else
            echo 'Signing secrets not configured; building unsigned release.'
            ./gradlew --no-daemon assembleRelease
          fi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HOMElauncher-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 1
